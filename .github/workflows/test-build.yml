name: Build & Deliver Plugin

# Builds the plugin jar on every push to master (and manually via
# workflow_dispatch), then uploads it to a webhook. Nothing is published as a
# GitHub Release or Artifact — it only leaves via the webhook call.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls in the packhost submodule

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Locate build jar
        id: jar
        run: |
          JAR_PATH=$(find . -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            | sort -r | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Collect build metadata
        id: meta
        run: |
          echo "plugin_name=EcoItems" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version' gradle.properties | cut -d'=' -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Send jar to webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "WEBHOOK_URL secret is not set" >&2
            exit 1
          fi

          MESSAGE=$(cat <<EOF
          {"content":"**${{ steps.meta.outputs.plugin_name }}** build\n> Version: \`${{ steps.meta.outputs.version }}\`\n> Commit: \`${{ steps.meta.outputs.commit }}\`\n> Built: ${{ steps.meta.outputs.build_date }}\n> File: \`${{ steps.jar.outputs.filename }}\`"}
          EOF
          )

          curl -sS -X POST "$WEBHOOK_URL" \
            -F "payload_json=$MESSAGE" \
            -F "file=@${{ steps.jar.outputs.path }}"
