name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EcoItems
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build shadowJar --no-daemon

      - name: Find JAR
        id: jar
        run: |
          JAR_PATH=$(find ./bin -type f -name "*.jar" | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found in bin/"
            find . -type f -name "*.jar"
            exit 1
          fi

          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Send JAR to Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$WEBHOOK_URL" \
            -F "payload_json={\"content\":\"✅ **Build complete!**\n**Version:** \`${{ github.sha }}\`\n**Branch:** \`${{ github.ref_name }}\`\n**Commit:** \`${{ github.sha }}\`\"}" \
            -F "file=@${{ steps.jar.outputs.path }};filename=${{ steps.jar.outputs.name }}"
